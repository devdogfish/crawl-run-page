[project]
name = "crawler-ai"
version = "0.1.0"
description = "AI side of the crawler app: MCP server, Ask AI chat and Cmd+K navigation over one tool layer."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "openai>=1.60",
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crawler_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
