<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SiteLens — an interactive website quality dashboard. Explore sample audits, filter findings, inspect pages, and replay a crawl." />
    <link rel="icon" href="/sitelens.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#13213b" />
    <meta property="og:title" content="SiteLens · Website quality, in focus" />
    <meta property="og:description" content="Explore an interactive website audit dashboard with connected filters, page inspection, and crawl playback." />
    <meta property="og:type" content="website" />
    <title>SiteLens · Website quality dashboard</title>
    <script>
      // Apply the saved theme and primary colour before first paint (next-themes key "theme", Settings key "crawler.brand")
      try {
        var t = localStorage.getItem("theme") || "system";
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.classList.add(t);
        document.documentElement.style.colorScheme = t;
        var b = localStorage.getItem("crawler.brand");
        if (b && /^#[0-9a-f]{6}$/i.test(b)) document.documentElement.style.setProperty("--brand", b);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
